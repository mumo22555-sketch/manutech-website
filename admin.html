<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Content Studio | Manu Tech</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { min-height: 100vh; background: #080b0f; }
    .studio { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 44px 0 80px; }
    .studio-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 44px; }
    .studio-head h1 { margin: 8px 0 0; font-size: 38px; }
    .studio-tabs { display: flex; gap: 6px; margin-bottom: 22px; }
    .studio-tabs button { min-height: 40px; border: 1px solid var(--line); color: var(--muted); background: transparent; padding: 0 16px; cursor: pointer; }
    .studio-tabs button.active { color: white; border-color: var(--blue); background: rgba(22,140,255,.12); }
    .studio-grid { display: grid; grid-template-columns: 260px 1fr; gap: 18px; }
    .list-panel, .editor-panel { border: 1px solid var(--line); background: #0b0e13; }
    .list-panel { padding: 12px; }
    .editor-panel { padding: 28px; }
    .item-button { width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); color: var(--paper); background: transparent; padding: 15px 8px; cursor: pointer; }
    .item-button span { display: block; color: var(--muted); font-size: 11px; margin-top: 5px; }
    .item-button.active { background: rgba(22,140,255,.08); }
    .new-button { width: calc(100% - 16px); margin: 8px; }
    .editor-panel label { display: block; color: var(--muted); font-size: 11px; margin-bottom: 16px; }
    .editor-panel input, .editor-panel textarea { width: 100%; margin-top: 7px; border: 1px solid var(--line); background: #06080b; color: white; padding: 12px; outline: none; }
    .editor-panel textarea { min-height: 120px; resize: vertical; }
    .editor-actions { display: flex; gap: 10px; }
    .delete-button { color: #ff9b9b; border: 1px solid rgba(255,100,100,.3); background: transparent; }
    .studio-status { min-height: 20px; color: var(--blue-bright); font-size: 12px; margin-top: 12px; }
    @media (max-width: 700px) { .studio-grid { grid-template-columns: 1fr; } .studio-head { align-items:flex-start; } }
  </style>
</head>
<body>
  <main class="studio">
    <div class="studio-head">
      <a class="brand" href="index.html"><span class="brand-mark">M</span><span>MANU<span class="brand-dot">TECH</span></span></a>
      <a class="text-link" href="index.html">← View website</a>
    </div>
    <div><div class="section-label"><span>STUDIO</span> CONTENT MANAGEMENT</div><h1>Manage your content.</h1></div>
    <div class="studio-tabs">
      <button class="active" data-tab="projects">Projects</button>
      <button data-tab="articles">Blog posts</button>
    </div>
    <div class="studio-grid">
      <aside class="list-panel"><button class="button button-primary new-button" id="new-item">+ New item</button><div id="item-list"></div></aside>
      <section class="editor-panel"><div id="editor"></div><p class="studio-status" id="studio-status" role="status"></p></section>
    </div>
  </main>
  <script src="admin.js"></script>
</body>
</html>
